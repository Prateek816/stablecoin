
[package]
name = "remittance-stablecoin"
version = "0.1.0"
description = "Token-2022 remittance stablecoin"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "remittance_stablecoin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build"
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
spl-token-2022-interface = "2"

[dependencies.anchor-spl]
version = "1.1.2"
features = ["token_2022_extensions"]

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
